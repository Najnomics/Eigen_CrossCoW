# Prometheus configuration for EigenCrossCoW AVS
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # EigenCrossCoW AVS metrics
  - job_name: 'eigencrosscow-avs'
    static_configs:
      - targets: ['avs-operator:9000']
    scrape_interval: 5s
    metrics_path: /metrics

  # Ethereum node metrics
  - job_name: 'ethereum-node'
    static_configs:
      - targets: ['ethereum-node:6060']
    scrape_interval: 10s

  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  # Node exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

  # Grafana metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    scrape_interval: 30s
