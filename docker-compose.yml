version: '3.8'

services:
  # Ethereum node (for local testing)
  ethereum-node:
    image: ethereum/client-go:latest
    container_name: eigencrosscow-ethereum
    ports:
      - "8545:8545"
      - "8546:8546"
    command: >
      --dev
      --http
      --http.addr 0.0.0.0
      --http.port 8545
      --http.api eth,net,web3,personal,admin
      --ws
      --ws.addr 0.0.0.0
      --ws.port 8546
      --ws.api eth,net,web3,personal,admin
      --allow-insecure-unlock
      --unlock 0x90F8bf6A479f320ead074411a4B0e7944Ea8c9C1
      --password /dev/null
    environment:
      - ETHEREUM_PASSWORD=
    volumes:
      - ethereum-data:/root/.ethereum
    networks:
      - eigencrosscow-network

  # Redis for caching and task queue
  redis:
    image: redis:7-alpine
    container_name: eigencrosscow-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - eigencrosscow-network

  # AVS Operator
  avs-operator:
    build:
      context: ./avs-operator
      dockerfile: Dockerfile
    container_name: eigencrosscow-operator
    ports:
      - "9000:9000"  # Metrics port
      - "8080:8080"  # API port
    environment:
      - ETH_RPC_URL=http://ethereum-node:8545
      - ETH_WS_URL=ws://ethereum-node:8546
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
      - METRICS_ENABLED=true
      - METRICS_PORT=9000
      - API_PORT=8080
    volumes:
      - ./avs-operator/config:/app/config
      - ./avs-operator/keys:/app/keys
    depends_on:
      - ethereum-node
      - redis
    networks:
      - eigencrosscow-network
    restart: unless-stopped

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: eigencrosscow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/rules:/etc/prometheus/rules
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - eigencrosscow-network
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: eigencrosscow-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - eigencrosscow-network
    restart: unless-stopped

  # Alertmanager for alerting
  alertmanager:
    image: prom/alertmanager:latest
    container_name: eigencrosscow-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    networks:
      - eigencrosscow-network
    restart: unless-stopped

  # Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: eigencrosscow-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - eigencrosscow-network
    restart: unless-stopped

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: eigencrosscow-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./monitoring/nginx.conf:/etc/nginx/nginx.conf
      - ./monitoring/ssl:/etc/nginx/ssl
    depends_on:
      - grafana
      - prometheus
      - alertmanager
    networks:
      - eigencrosscow-network
    restart: unless-stopped

  # Log aggregation
  loki:
    image: grafana/loki:latest
    container_name: eigencrosscow-loki
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - ./monitoring/loki.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - eigencrosscow-network
    restart: unless-stopped

  # Log collection
  promtail:
    image: grafana/promtail:latest
    container_name: eigencrosscow-promtail
    volumes:
      - /var/log:/var/log:ro
      - ./monitoring/promtail.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - eigencrosscow-network
    restart: unless-stopped

volumes:
  ethereum-data:
  redis-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  loki-data:

networks:
  eigencrosscow-network:
    driver: bridge
